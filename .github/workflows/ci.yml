name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting check.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - name: cargo fmt --check
        run: cargo fmt --all --check

  # Lint with clippy, treating warnings as errors.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with clippy
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (brotli-c)
        run: cargo clippy -p wuff --no-default-features --features brotli-c,z --all-targets -- -D warnings

  # Basic compile check of the whole workspace on stable.
  check:
    name: check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: cargo check (default features)
        run: cargo check --workspace --all-targets
      - name: cargo check (no default features)
        run: cargo check -p wuff --no-default-features
      - name: cargo check (brotli-c)
        run: cargo check --workspace --all-targets --features wuff/brotli-c

  # Verify the crate still builds on its declared MSRV (see `rust-version` in
  # the Cargo.toml files; keep this in sync).
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - name: cargo check
        run: cargo +1.85 check --workspace

  # Verify the library compiles for a bare-metal no_std target.
  # `z`/flate2 is std-only, so only the core and `brotli` builds are checked.
  no_std:
    name: no_std (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with no_std target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add thumbv7em-none-eabi
      - name: cargo check (core, no_std)
        run: cargo check -p wuff --no-default-features --target thumbv7em-none-eabi
      - name: cargo check (brotli, no_std)
        run: cargo check -p wuff --no-default-features --features brotli --target thumbv7em-none-eabi

  # Verify the C Brotli backend builds and links for wasm-bindgen's target. There is no libc on
  # `wasm32-unknown-unknown`, so this exercises the libc shims in `wuff/csrc/wasm-libc-shim`.
  # `cargo check` only compiles the C code; building a cdylib is what actually links it.
  wasm:
    name: brotli-c (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain with wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
      - name: cargo build (brotli-c, wasm32-unknown-unknown)
        run: cargo build -p wuff --no-default-features --features brotli-c --target wasm32-unknown-unknown
      - name: link a cdylib against the C decoder
        run: |
          mkdir -p /tmp/wasm-link/src
          cat > /tmp/wasm-link/Cargo.toml <<'TOML'
          [package]
          name = "wasm-link"
          version = "0.0.0"
          edition = "2024"
          publish = false
          [lib]
          crate-type = ["cdylib"]
          [dependencies]
          wuff = { path = "${{ github.workspace }}/wuff", default-features = false, features = ["brotli-c"] }
          [workspace]
          TOML
          cat > /tmp/wasm-link/src/lib.rs <<'RS'
          #[unsafe(no_mangle)]
          pub extern "C" fn wuff_wasm_link_check(ptr: *const u8, len: usize) -> usize {
              let data = unsafe { core::slice::from_raw_parts(ptr, len) };
              wuff::decompress_woff2(data).map(|v| v.len()).unwrap_or(0)
          }
          RS
          cargo build --manifest-path /tmp/wasm-link/Cargo.toml --release --target wasm32-unknown-unknown
